# Which capture profile produced (or later verified) each committed screenshot.
#
# Keyed by manifest id, or by repository-relative path for a legacy PNG. Never
# record Portal URLs: they carry tenant, subscription, and resource identifiers.
# Captures made before portal-desktop-v1 existed are intentionally absent rather
# than stamped with a profile they were not produced under.
#
# Two record kinds:
#   (no kind)        produced by scripts/capture/capture.cjs under `produced.profile`.
#   legacy_reencode  a pre-profile PNG re-encoded to WebP without recapture. It does
#                    NOT claim a capture profile; `derived_from` pins the source PNG
#                    bytes at the base revision, and the record is immutable: a new
#                    image must be a real capture with a `produced` record.

