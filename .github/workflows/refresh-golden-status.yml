name: Refresh Golden Status

# The committed dashboard can only report "Golden" when every gate actually ran,
# and a developer machine rarely has the full toolchain (shellcheck, Node, .NET,
# Java, Bicep) plus network access. This job is the repository's reproducible
# way to produce a snapshot with no Skipped rows.
#
# Not triggered by `push` because provisioning five toolchains takes minutes;
# running that on every commit would be the slowest job in the repository for a
# page that only needs to be periodically accurate.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-golden-status
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Golden Status
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      # 3.12 matches the Python Flask App CI job, so the Python app gates run on
      # the runtime they are actually shipped against. One interpreter serves the
      # whole job; the documentation validators are not pinned to 3.11.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/nodejs/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install toolchains the gates require
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          az bicep install
          npm --prefix apps/nodejs ci
          pip install -r requirements-docs.txt 'ruamel.yaml==0.19.1' requests
          pip install -r apps/python-flask/requirements-dev.txt

      - name: Regenerate the dashboard with every gate
        run: |
          python scripts/generate_golden_status.py --include-network

      # Opens a pull request rather than pushing to main: AGENTS.md routes every
      # change through the PR gates, and a bot push would land an unreviewed
      # snapshot that the required checks never saw. A PR raised with the default
      # GITHUB_TOKEN may need a write user to approve its workflow runs.
      - name: Open a pull request with the refreshed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/meta/golden-status.md; then
            echo "Dashboard unchanged; nothing to open."
            exit 0
          fi
          BRANCH=chore/refresh-golden-status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$BRANCH"
          git add docs/meta/golden-status.md
          git commit --message 'chore: refresh golden status dashboard'
          # Fetching the bare branch name only updates FETCH_HEAD, which leaves
          # --force-with-lease without a baseline and makes every run after the
          # first fail with "stale info". The explicit refspec creates the
          # remote-tracking ref the lease compares against.
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git push --force-with-lease --set-upstream origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "A pull request for $BRANCH is already open."
            exit 0
          fi
          if gh pr create --base main --head "$BRANCH" \
              --title 'chore: refresh golden status dashboard' \
              --body 'Regenerated by the scheduled Refresh Golden Status workflow with the full toolchain and `--include-network`. Review the Gate Results table before merging.'; then
            exit 0
          fi
          # The branch is already pushed, so a failure here must not throw the
          # refreshed snapshot away. The usual cause is the repository setting
          # "Allow GitHub Actions to create and approve pull requests"
          # (Settings -> Actions -> General -> Workflow permissions), off by
          # default, but the message stays generic because it is not the only one.
          {
            echo "### Golden Status refreshed, pull request not opened"
            echo
            echo "Branch \`$BRANCH\` is pushed, but this workflow could not open a pull request."
            echo "If the cause is permissions, enable *Allow GitHub Actions to create and approve pull requests* in repository settings. Otherwise open it manually:"
            echo
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
