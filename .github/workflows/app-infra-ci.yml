name: App and Infra CI

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'docs/**'
      - 'labs/**'
      - 'evidence/**'
      - 'schemas/golden/**'
      - 'tests/golden/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'docs/**'
      - 'labs/**'
      - 'evidence/**'
      - 'schemas/golden/**'
      - 'tests/golden/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'

permissions:
  contents: read

jobs:
  classify:
    name: Classify App and Infra Changes
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.impact.outputs.scripts }}
      nodejs: ${{ steps.impact.outputs.nodejs }}
      nodejs_container: ${{ steps.impact.outputs.nodejs_container }}
      python: ${{ steps.impact.outputs.python }}
      dotnet: ${{ steps.impact.outputs.dotnet }}
      java: ${{ steps.impact.outputs.java }}
      bicep: ${{ steps.impact.outputs.bicep }}
      golden: ${{ steps.impact.outputs.golden }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test impact classifier
        run: python -m unittest scripts/test_impact_classifier.py scripts/test_impact_ci.py

      - name: Select impacted jobs
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          python scripts/impact_ci.py select \
            --event-name "$EVENT_NAME" \
            --pr-base "$PR_BASE" \
            --push-base "$PUSH_BASE" \
            --github-output "$GITHUB_OUTPUT"

  scripts:
    name: Shell Scripts
    needs: classify
    if: needs.classify.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          find apps labs scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n

      - name: Run ShellCheck
        run: |
          find apps labs scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck

  lab-verifiers:
    name: Lab Evidence Verifiers
    needs: classify
    if: needs.classify.outputs.golden == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect absorbed strong/fallback gate predicates
        run: |
          python3 -m doctest scripts/detect_absorbed_predicates.py
          python3 scripts/detect_absorbed_predicates.py labs \
            --allowlist scripts/absorbed-predicate-allowlist.txt \
            --repo-root .

      - name: Run startup-failure evaluator regression suite
        run: python3 labs/deployment-succeeded-startup-failed/test_run.py

      - name: Confirm the evaluator fails closed with no evidence
        run: |
          empty_run_dir="$(mktemp -d)"
          if python3 labs/deployment-succeeded-startup-failed/run.py evaluate "${empty_run_dir}"; then
            echo "The evaluator exited 0 for a run directory containing no evidence." >&2
            echo "It must fail closed rather than report an unverified success." >&2
            exit 1
          fi

  nodejs:
    name: Node.js App
    needs: classify
    if: needs.classify.outputs.nodejs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nodejs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/nodejs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run tests
        run: npm test

      - name: Verify production install
        run: npm ci --omit=dev --dry-run

  nodejs-container:
    name: Node.js Container Smoke
    needs: classify
    if: needs.classify.outputs.nodejs_container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Builds the image the guide tells readers to deploy, runs it, and proves
      # /health answers and sshd stays up. The npm job above never builds the
      # image, so a base-image or Alpine/OpenSSH regression would otherwise pass.
      - name: Build and smoke-test the container image
        run: apps/nodejs/smoke-container.sh

  python:
    name: Python Flask App
    needs: classify
    if: needs.classify.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/python-flask/requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall apps/python-flask/src apps/python-flask/tests

      - name: Run tests
        run: python -m pytest apps/python-flask/tests

  dotnet:
    name: ASP.NET Core App
    needs: classify
    if: needs.classify.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build project
        run: dotnet build apps/dotnet-aspnetcore/GuideApi/GuideApi.csproj

  java:
    name: Java Spring Boot App
    needs: classify
    if: needs.classify.outputs.java == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/java-springboot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: mvn -q test

  bicep:
    name: Bicep Templates
    needs: classify
    if: needs.classify.outputs.bicep == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Bicep templates and parameter files
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            find apps labs -type f -name '*.bicep' -print | sort | while IFS= read -r file; do
              echo "Building ${file}"
              # </dev/null stops `az` from consuming the file list on stdin.
              # Without it this loop silently stops after the first template.
              az bicep build --file "${file}" --stdout >/dev/null </dev/null
            done
            # Parameter files are a separate compilation surface: a profile
            # pinning a value the template no longer allows fails only here, so
            # building *.bicep alone is a false green.
            find apps labs -type f -name '*.bicepparam' -print | sort | while IFS= read -r file; do
              echo "Building ${file}"
              az bicep build-params --file "${file}" --stdout >/dev/null </dev/null
            done

  app-infra-result:
    name: App and Infra CI Result
    if: always()
    needs:
      - classify
      - scripts
      - nodejs
      - nodejs-container
      - python
      - dotnet
      - java
      - bicep
      - lab-verifiers
    runs-on: ubuntu-latest
    env:
      SELECTED_SCRIPTS: ${{ needs.classify.outputs.scripts }}
      SELECTED_NODEJS: ${{ needs.classify.outputs.nodejs }}
      SELECTED_NODEJS_CONTAINER: ${{ needs.classify.outputs.nodejs_container }}
      SELECTED_PYTHON: ${{ needs.classify.outputs.python }}
      SELECTED_DOTNET: ${{ needs.classify.outputs.dotnet }}
      SELECTED_JAVA: ${{ needs.classify.outputs.java }}
      SELECTED_BICEP: ${{ needs.classify.outputs.bicep }}
      RESULT_CLASSIFY: ${{ needs.classify.result }}
      RESULT_SCRIPTS: ${{ needs.scripts.result }}
      RESULT_NODEJS: ${{ needs.nodejs.result }}
      RESULT_NODEJS_CONTAINER: ${{ needs.nodejs-container.result }}
      RESULT_PYTHON: ${{ needs.python.result }}
      RESULT_DOTNET: ${{ needs.dotnet.result }}
      RESULT_JAVA: ${{ needs.java.result }}
      RESULT_BICEP: ${{ needs.bicep.result }}
      SELECTED_GOLDEN: ${{ needs.classify.outputs.golden }}
      RESULT_GOLDEN: ${{ needs.lab-verifiers.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Require every selected job to succeed
        run: python scripts/impact_ci.py aggregate
