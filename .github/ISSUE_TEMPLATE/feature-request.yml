name: Feature or task
description: Propose a focused capability or maintenance task
title: 'feat: '
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain the use case, current gap and proposed local scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Checklist
      description: Concrete, verifiable completion criteria. Maintainers choose a priority label.
      placeholder: '- [ ] Describe an observable result'
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Out of scope
      description: Explicit exclusions and separate tracking issues, or None.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Related local issues, reference implementations or documents, or None.
    validations:
      required: true
