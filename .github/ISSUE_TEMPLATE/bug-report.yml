name: Bug report
description: Report a reproducible code or runbook defect
title: 'fix: '
labels: [bug, needs-triage]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include steps, environment, expected/actual behavior and sanitized evidence. No secrets or customer identifiers.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Checklist
      description: State verifiable results. A maintainer assigns one priority and one size label after triage, and compares the full open backlog.
      placeholder: '- [ ] Describe an observable result'
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Out of scope
      description: Explicit exclusions, or None.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Related issues, versions, documentation and evidence, or None.
    validations:
      required: true
