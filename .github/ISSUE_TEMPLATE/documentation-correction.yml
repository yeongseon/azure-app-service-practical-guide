name: Documentation correction
description: Correct an inaccurate claim or non-runnable instruction
title: 'docs: '
labels: [documentation, needs-triage]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Identify the page, incorrect claim, tested environment/date and supporting source or sanitized evidence.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Checklist
      description: State verifiable corrections. Do not claim Azure testing that was not performed.
      placeholder: '- [ ] Correct the scoped claim and verify the instructions'
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Out of scope
      description: Explicit exclusions, or None.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Related issues, documentation and evidence, or None.
    validations:
      required: true
